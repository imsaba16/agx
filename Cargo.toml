[package]
name = "agx"
version = "1.0.0-rc.3"
edition = "2021"
authors = ["Antigravity Developers"]
description = "agx: Antigravity eXtension — Enterprise context exchange, session diffing, zero-decompression search, and backup engine for Google Antigravity."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/imsaba16/agx"
homepage = "https://github.com/imsaba16/agx"
keywords = ["antigravity", "ai-agents", "context-exchange", "developer-tools", "backup"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
tar = "0.4"
walkdir = "2.5"
regex = "1.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
dirs = "7.0"
anyhow = "1.0"
tempfile = "3.12"
globset = "0.4"
inquire = "0.7"
zstd = "0.13"
rayon = "1.10"
indicatif = "0.17"
comfy-table = "7.1"
clap_complete = "4.5"
sha2 = "0.10"
similar = "2.6"
ratatui = "0.30"
crossterm = "0.29"

