[package]
name = "agx"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Developer"]
description = "agx: Antigravity Context & Brain eXchange tool for exporting, sanitizing, and sharing sessions across machines."

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
tar = "0.4"
walkdir = "2.5"
regex = "1.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
dirs = "5.0"
anyhow = "1.0"
tempfile = "3.12"
globset = "0.4"
inquire = "0.7"
zstd = "0.13"
rayon = "1.10"
