name: Feature Request
description: Propose a new feature, improvement, or workflow enhancement for agx.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea for **Antigravity eXtension (`agx`)**!
        We encourage community feedback to expand our agent trajectory tooling and enterprise features.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or workflow friction?
      placeholder: "I'm always frustrated when I need to filter archives by date range..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & CLI Interface
      description: Describe the solution you would like, including proposed commands or flags.
      placeholder: "Add `--since <date>` flag to `agx list` and `agx search`..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches Considered
      description: Describe any alternative solutions or workarounds you've evaluated.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, references to other tools, or screenshots.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request implementing this feature.
          required: false
