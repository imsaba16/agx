name: Release Multi-Platform Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-check:
    name: Determine Release Tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and existing tag
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
            TAG="v$VERSION"
            echo "Manual workflow dispatch for $TAG"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            echo "Triggered by manual tag: $TAG"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
            TAG="v$VERSION"
            echo "Cargo.toml version: $VERSION -> Target tag: $TAG"
            
            if curl -s -f -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" >/dev/null; then
              echo "GitHub release for $TAG already exists. Skipping."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "GitHub release for $TAG does not exist yet. Proceeding with release!"
              if ! git rev-parse "$TAG" >/dev/null 2>&1; then
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git tag -a "$TAG" -m "Release $TAG"
                git push origin "$TAG"
              fi
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    name: Build - ${{ matrix.name }} (${{ matrix.target }})
    needs: tag-check
    if: needs.tag-check.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (ARM64)
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            binary_name: agx
            archive_ext: tar.gz
            asset_stem: agx-macos-arm64

          # macOS Intel (x86_64)
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            binary_name: agx
            archive_ext: tar.gz
            asset_stem: agx-macos-x86_64

          # Linux x86_64 (GNU)
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: agx
            archive_ext: tar.gz
            asset_stem: agx-linux-x86_64

          # Windows x86_64 (MSVC)
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: agx.exe
            archive_ext: zip
            asset_stem: agx-windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # Packaging Unix (.tar.gz)
      - name: Package Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          PKG_DIR="package"
          mkdir -p "$PKG_DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$PKG_DIR/agx"
          chmod +x "$PKG_DIR/agx"
          cp README.md LICENSE "$PKG_DIR/"
          
          ARCHIVE_NAME="${{ matrix.asset_stem }}.tar.gz"
          tar -czvf "$ARCHIVE_NAME" -C "$PKG_DIR" .
          shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"

      # Packaging Windows (.zip)
      - name: Package Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PKG_DIR = "package"
          New-Item -ItemType Directory -Force -Path $PKG_DIR | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$PKG_DIR/agx.exe"
          Copy-Item README.md, LICENSE -Destination "$PKG_DIR/"
          
          $ARCHIVE_NAME = "${{ matrix.asset_stem }}.zip"
          Compress-Archive -Path "$PKG_DIR/*" -DestinationPath $ARCHIVE_NAME -Force
          $hash = (Get-FileHash -Path $ARCHIVE_NAME -Algorithm SHA256).Hash.ToLower()
          "$hash  $ARCHIVE_NAME" | Out-File -FilePath "$ARCHIVE_NAME.sha256" -Encoding ascii

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_stem }}
          path: |
            ${{ matrix.asset_stem }}.${{ matrix.archive_ext }}
            ${{ matrix.asset_stem }}.${{ matrix.archive_ext }}.sha256

  release:
    name: Create GitHub Release
    needs: [tag-check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS.txt
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-check.outputs.tag_name }}
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Automatically Update Homebrew Tap & Scoop Bucket
        if: env.RELEASE_TOKEN != ''
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG_NAME: ${{ needs.tag-check.outputs.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          echo "Updating distribution repositories for release $VERSION..."

          MAC_ARM64_HASH=$(grep "agx-macos-arm64.tar.gz" release-assets/SHA256SUMS.txt | awk '{print $1}')
          MAC_X86_64_HASH=$(grep "agx-macos-x86_64.tar.gz" release-assets/SHA256SUMS.txt | awk '{print $1}')
          LINUX_HASH=$(grep "agx-linux-x86_64.tar.gz" release-assets/SHA256SUMS.txt | awk '{print $1}')
          WIN_HASH=$(grep "agx-windows-x86_64.zip" release-assets/SHA256SUMS.txt | awk '{print $1}')

          # 1. Update Homebrew Tap
          git clone "https://x-access-token:${RELEASE_TOKEN}@github.com/imsaba16/homebrew-agx.git" homebrew-tap
          cd homebrew-tap
          cat <<EOF > Formula/agx.rb
          class Agx < Formula
            desc "Context exchange, session diffing, search, and backup engine for Google Antigravity"
            homepage "https://github.com/imsaba16/agx"
            version "$VERSION"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/imsaba16/agx/releases/download/v#{version}/agx-macos-arm64.tar.gz"
                sha256 "$MAC_ARM64_HASH"
              else
                url "https://github.com/imsaba16/agx/releases/download/v#{version}/agx-macos-x86_64.tar.gz"
                sha256 "$MAC_X86_64_HASH"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "https://github.com/imsaba16/agx/releases/download/v#{version}/agx-linux-x86_64.tar.gz"
                sha256 "$LINUX_HASH"
              end
            end

            def install
              bin.install "agx"
              generate_completions_from_executable(bin/"agx", "completion")
            end

            test do
              assert_match "agx #{version}", shell_output("#{bin}/agx --version")
            end
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agx.rb
          git commit -m "chore(release): bump agx to $VERSION" || echo "No changes to commit"
          git push origin main
          cd ..

          # 2. Update Scoop Bucket
          git clone "https://x-access-token:${RELEASE_TOKEN}@github.com/imsaba16/scoop-bucket.git" scoop-repo
          cd scoop-repo
          cat <<EOF > bucket/agx.json
          {
            "version": "$VERSION",
            "description": "Enterprise context exchange, session diffing, search, and backup engine for Google Antigravity",
            "homepage": "https://github.com/imsaba16/agx",
            "license": "Apache-2.0",
            "architecture": {
              "64bit": {
                "url": "https://github.com/imsaba16/agx/releases/download/v$VERSION/agx-windows-x86_64.zip",
                "hash": "$WIN_HASH"
              }
            },
            "bin": "agx.exe",
            "checkver": "github",
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/imsaba16/agx/releases/download/v\$version/agx-windows-x86_64.zip"
                }
              }
            }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/agx.json
          git commit -m "chore(release): bump agx to $VERSION" || echo "No changes to commit"
          git push origin main
          cd ..
