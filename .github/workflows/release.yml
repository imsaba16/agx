name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build - ${{ matrix.name }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (ARM64)
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            binary_name: agx
            archive_ext: tar.gz
            asset_stem: agx-macos-arm64

          # macOS Intel (x86_64)
          - name: macOS x86_64
            os: macos-13
            target: x86_64-apple-darwin
            binary_name: agx
            archive_ext: tar.gz
            asset_stem: agx-macos-x86_64

          # Linux x86_64 (GNU)
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: agx
            archive_ext: tar.gz
            asset_stem: agx-linux-x86_64

          # Windows x86_64 (MSVC)
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: agx.exe
            archive_ext: zip
            asset_stem: agx-windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # Packaging Unix (.tar.gz)
      - name: Package Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          TAG_NAME="${{ github.ref_name }}"
          PKG_DIR="package"
          mkdir -p "$PKG_DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$PKG_DIR/agx"
          chmod +x "$PKG_DIR/agx"
          cp README.md LICENSE "$PKG_DIR/"
          
          ARCHIVE_NAME="${{ matrix.asset_stem }}.tar.gz"
          tar -czvf "$ARCHIVE_NAME" -C "$PKG_DIR" .
          shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"

      # Packaging Windows (.zip)
      - name: Package Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PKG_DIR = "package"
          New-Item -ItemType Directory -Force -Path $PKG_DIR | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$PKG_DIR/agx.exe"
          Copy-Item README.md, LICENSE -Destination "$PKG_DIR/"
          
          $ARCHIVE_NAME = "${{ matrix.asset_stem }}.zip"
          Compress-Archive -Path "$PKG_DIR/*" -DestinationPath $ARCHIVE_NAME -Force
          $hash = (Get-FileHash -Path $ARCHIVE_NAME -Algorithm SHA256).Hash.ToLower()
          "$hash  $ARCHIVE_NAME" | Out-File -FilePath "$ARCHIVE_NAME.sha256" -Encoding ascii

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_stem }}
          path: |
            ${{ matrix.asset_stem }}.${{ matrix.archive_ext }}
            ${{ matrix.asset_stem }}.${{ matrix.archive_ext }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS.txt
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
